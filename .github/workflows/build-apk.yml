name: Build Android APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Pre-build Sanity Checks
      working-directory: ./
      run: |
        echo "=== BẮT ĐẦU RÀ SOÁT LỖI TỰ ĐỘNG ==="
        
        # 1. Kiểm tra cú pháp JavaScript
        echo "1. Kiểm tra cú pháp JavaScript..."
        find web -name "*.js" -exec node -c {} \; || { echo "❌ LỖI: Có lỗi cú pháp JavaScript trong thư mục web!"; exit 1; }
        
        # 2. Kiểm tra khai báo Capacitor Plugins (Android)
        echo "2. Kiểm tra khai báo Native Android..."
        if grep -q "@codetrix-studio/capacitor-google-auth" mobile/package.json; then
          if ! grep -q "registerPlugin(GoogleAuth.class)" mobile/android/app/src/main/java/vn/tainnovation/store/MainActivity.java; then
            echo "❌ LỖI: Thiếu đăng ký GoogleAuth.class trong MainActivity.java!"; exit 1;
          fi
          if ! grep -q "server_client_id" mobile/android/app/src/main/res/values/strings.xml; then
            echo "❌ LỖI: Thiếu server_client_id trong strings.xml!"; exit 1;
          fi
        fi
        
        echo "✅ HOÀN TẤT RÀ SOÁT! MÃ NGUỒN SẠCH."

    - name: Install dependencies and build web
      working-directory: ./mobile
      env:
        API_BASE: ${{ vars.STOREFRONT_API_BASE }}
        ADMIN_API_BASE: ${{ vars.ADMIN_API_BASE }}
      run: |
        test -n "$API_BASE" || { echo "Missing repository variable STOREFRONT_API_BASE"; exit 1; }
        test -n "$ADMIN_API_BASE" || { echo "Missing repository variable ADMIN_API_BASE"; exit 1; }
        npm ci
        npm run sync

    - name: Prepare Android signing
      working-directory: ./mobile/android
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "ANDROID_KEYSTORE_FILE=$PWD/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -v -keystore release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -E 'SHA1:|SHA256:'
        else
          echo "No Android signing secret configured; using Gradle debug signing."
        fi

    - name: Build APK
      working-directory: ./mobile/android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
