version: 1
meta:
  name: app-web-sync-check
  description: >
    Chạy song song App (:8810) và Web FastAPI (:8000), kiểm chứng luồng đồng bộ
    App ↔ Website end-to-end trên CSDL dùng chung.
  author: vetc
  created: 2026-06-24

goal:
  statement: >
    App (server.py :8810) và Website (FastAPI :8000) chạy song song; chứng minh
    luồng đồng bộ qua DB dùng chung: tồn kho App lấy từ Web; đặt đơn trên App ghi
    thành đơn 'pending' channel=App có quy nhân viên trong Web; màn Admin
    "Đối soát & Duyệt" thấy đơn; Thông báo + "Đơn hàng của tôi" trên App phản ánh.
  context_sources:
    - file: ../server.py
    - file: ../qlbh_sync.py
    - file: ../QLBH-Website/main.py
  definition_of_done: >
    Cả 2 máy chủ trả 200; sync_check.py đạt 100% bước (tồn kho khớp, đặt đơn App →
    đơn Web pending/App/sales, admin thấy đơn, App phản ánh ngược) — exit 0;
    người vận hành xác nhận đồng bộ.
  verification:
    - id: sync-roundtrip
      type: programmatic
      check: ["python3", "looper-sync/loop-workspace/checks/sync_check.py"]
      expect: exit_zero
    - id: operator-confirm
      type: human
      prompt: >
        Xác nhận App & Web đang chạy song song và luồng đồng bộ (đặt đơn App →
        hiện ở Admin Web → phản ánh lại App) hoạt động đúng.

host:
  cli: claude
  model: default
  invoke: ["claude", "-p"]
  timeout_sec: 600

gates:
  plan_gate:
    when: after_plan
    members: []
    verdict_policy: revise_until_clean
    verdict_source: human
    criteria: []
    max_revisions: 2
  delivery_gate:
    when: after_each_delivery
    members: []
    verdict_policy: revise_until_clean
    verdict_source: human
    criteria: [sync-roundtrip]
    max_revisions: 3

loop_control:
  max_iterations: 5
  budget:
    wall_clock_min: 20
  no_progress:
    max_stalled_iterations: 2
    signals:
      - cùng một bước sync_check lặp lại lỗi
      - không khởi động được máy chủ thiếu
    action: stop
  human_checkpoints:
    - "Khi sync_check đạt: người vận hành xác nhận đồng bộ (operator-confirm)"
  stop_conditions:
    - sync_check.py exit 0 + người vận hành xác nhận
    - max_iterations đạt 5
    - cùng lỗi lặp 2 vòng (no-progress)
    - vượt trần thời gian 20 phút

execution:
  mode: in_session
  isolation: current_workspace   # gốc = storefront/ ; chạy 2 máy chủ song song
  side_effects:
    requires_approval: false      # chỉ tạo 1 đơn kiểm thử vào DB dùng chung
    duplicate_action_check: true  # mỗi lần chạy tạo 1 đơn test (chấp nhận trong môi trường dev)

observability:
  state_file: state.json
  run_log: run-log.md
  checkpoint_granularity: gate

workspace:
  dir: ./loop-workspace
  layout: [state.json, run-log.md]
