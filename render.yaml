# Render Blueprint — TA innovation
# Deploy 2 backend Python lên HTTPS (thay cho VM raw-IP http://34.21.152.227).
# Cả 2 service dùng chung 1 DATABASE_URL (Supabase PostgreSQL).

services:
  # ── 1. App khách hàng (PWA) — server.py phục vụ cả web/ tĩnh lẫn /api ──
  - type: web
    name: ta-store-pwa
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r QLBH-Website/requirements.txt
    startCommand: python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false

  # ── 2. API quản trị (admin dashboard trên Netlify gọi vào đây) ──
  - type: web
    name: ta-admin-api
    runtime: python
    plan: free
    rootDir: QLBH-Website
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
